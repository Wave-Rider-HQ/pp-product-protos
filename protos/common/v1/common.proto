syntax = "proto3";

package common.v1;

option go_package = "github.com/Wave-Rider-HQ/pp-product-protos/pb/common/v1;commonv1";

enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_YOUTUBE = 1;
  PLATFORM_INSTAGRAM = 2;
  PLATFORM_TWITTER = 3;
  PLATFORM_LINKEDIN = 4;
  PLATFORM_REDDIT = 5;
}

message ResponseStatus {
  bool success = 1;
  string message = 2;
}
