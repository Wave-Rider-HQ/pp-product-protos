syntax = "proto3";

package events.v1;

option go_package = "github.com/Wave-Rider-HQ/pp-product-protos/pb/events/v1;eventsv1";

import "google/protobuf/timestamp.proto";
import "common/v1/common.proto";
import "content/v1/video.proto";

// UserRegistered is emitted by api.UserService.Register in the same
// transaction as the user row (via the transactional outbox), and consumed
// by worker-onboarding.
message UserRegistered {
  string user_id = 1;
  common.v1.Platform platform = 2;
  string own_channel_id = 3;
  repeated string tags = 4;
  repeated string competitor_handles = 5;
  google.protobuf.Timestamp occurred_at = 6;
}

// PersonaRequested is emitted by worker-onboarding once a user's own recent
// videos have been fetched, and consumed by worker-persona.
message PersonaRequested {
  string user_id = 1;
  repeated content.v1.VideoPacket own_recent_videos = 2;
  repeated string tags = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// ChannelNewUpload is emitted by scheduler when a tracked channel's poll
// finds a new video, and consumed by worker-content, which fans it out to
// every subscriber of that channel.
message ChannelNewUpload {
  string channel_id = 1;
  common.v1.Platform platform = 2;
  content.v1.VideoPacket video = 3;
  google.protobuf.Timestamp occurred_at = 4;
}

// ContentGenerationRequested is emitted (via transactional outbox) by
// ContentEngineService.CreateContentRequest — and by worker-content itself
// for the competitor-upload fan-out path — once a content_requests row is
// persisted. Consumed by worker-content to run stage-1 generation.
message ContentGenerationRequested {
  string content_request_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
}

// ContentApprovalRequested is emitted (via transactional outbox) by
// ContentEngineService.ApproveRecommendation once a recommendation is
// approved. Consumed by worker-content to run stage-2 generation.
message ContentApprovalRequested {
  string content_request_id = 1;
  string recommendation_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
}

// ContentEngineEvent is the envelope published to the shared
// content.engine-events topic — both content-engine triggers ride one
// topic rather than one each, matching this schema's existing "one shared
// DLQ topic" approach to a tight topic budget.
message ContentEngineEvent {
  oneof event {
    ContentGenerationRequested generation_requested = 1;
    ContentApprovalRequested approval_requested = 2;
  }
}
